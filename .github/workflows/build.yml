name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Hacer ejecutable gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Renombrar APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/SensisGoodFF-v3.2.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SensisGoodFF-APK
          path: app/build/outputs/apk/debug/SensisGoodFF-v3.2.apk
          retention-days: 30

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2-${{ github.run_number }}
          name: "SENSIS GOOD FF v3.2 (Build ${{ github.run_number }})"
          body: |
            ## ⚡ SENSIS GOOD FF v3.2
            - 🎯 Generador de sensibilidades nativo Kotlin
            - 📧 Acceso por código OTP via email
          files: app/build/outputs/apk/debug/SensisGoodFF-v3.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
